#Proyectos
proyecto.1.titulo=Curriculum Vitae + Portfolio
proyecto.1.descripcion=Desarrollo de una página web en la que se presenta mi currículum personal y un portfolio de proyectos desarrollados por mí. Este proyecto habla de mí, de mi formación, de mis conocimientos, mis idiomas y mi experiencia.
proyecto.2.titulo=Desarrollo de la página web para la Hermandad de la Vera+Cruz de Albaida del Aljarafe
proyecto.2.descripcion=Desarrollo de la página web de la hermandad de la Vera+Cruz de Albaida del Aljarafe. En este diseño web crearé un punto de encuentro en el que cada hermano podrá acceder a su perfil y a todos sus datos, además de apuntarse a las actividades que la hermandad desarrolle y consultar todos sus eventos.
proyecto.3.titulo=Diseño de un panel de administración de una página web ficticia
proyecto.3.descripcion=Diseño de un panel de administración de una tienda ficticia, propuesto por una profesora para la asignatura de Diseño de Interfaces Web. En este reto, nos facilitó una guía de estilos y nosotros tuvimos que diseñar el panel a partir de ella.

