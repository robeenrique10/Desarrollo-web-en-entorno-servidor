<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Solicitud de Préstamo</title>
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </head>
    <body>

        <header>
            <h1>Solicitud de Préstamo</h1>
        </header>

        <main>
            <p>Complete la solicitud que se le muestra a continuación</p>

            <!--th:action="@{/solicitudes}" redirige el formulario al validador del controlador.
            th:object="${solicitudPrestamoForm}" vincula el formulario al DTO para ir validando los campos-->
            <form th:action="@{/solicitudes}" th:object="${solicitudPrestamoForm}" method="post" style="margin-top: 20px;">

                <!-- Nombre del solicitante -->
                <div class="form-group">
                    <label for="nombre">Nombre completo:</label>
                    <!-- th:field="*{nombre}" validará el nombre del solicitante a través del DTO -->
                    <input type="text" id="nombre" th:field="*{nombre}" placeholder="Introduce tu nombre">
                    <!-- Muestra los mensajes de error en el DTO -->
                    <span class="error-msg" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}">Error en el nombre</span>
                </div>

                <!-- Correo electrónico -->
                <div class="form-group">
                    <label for="correo">Correo electrónico:</label>
                    <!-- *{correo} validará el correo con el DTO -->
                    <input type="email" id="correo" th:field="*{correo}" placeholder="correo@ejemplo.com">
                    <!-- Buscará el error representado en el DTO y lo mostrará -->
                    <span class="error-msg" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}">Error en el correo</span>
                </div>

                <!-- Selección de material -->
                <div class="form-group">
                    <label for="materiales">Selecciona el material:</label>
                    <!-- *{materiales} validará el campo con el DTO -->
                    <select id="materiales" th:field="*{materiales}">
                        <option value="">-- Selecciona una opción --</option>
                        <!-- th:each recorre el array que creamos en el controlador
                        th:value asigna uno de los valores del array
                        th:text muestra el nombre del material que se encuentra en el array-->
                        <option th:each="mat : ${catalogo}" th:value="${mat[0]}" th:text="${mat[1]}">Material</option>
                    </select>
                    <!-- Mostrará el mensaje de error que introdujimos en el DTO -->
                    <span class="error-msg" th:if="${#fields.hasErrors('materiales')}" th:errors="*{materiales}">Error en el material</span>
                </div>

                <!-- Fecha de recogida -->
                <div class="form-group">
                    <label for="fechaRecogida">Fecha de recogida:</label>
                    <!-- *{fechaRecogida} validará el campo fechaRecogida con el DTO -->
                    <input type="date" id="fechaRecogida" th:field="*{fechaRecogida}">
                    <!-- Muestra el mensaje de error que pusimos en el DTO-->
                    <span class="error-msg" th:if="${#fields.hasErrors('fechaRecogida')}" th:errors="*{fechaRecogida}">Error en la fecha de recogida</span>
                </div>

                <!-- Fecha de devolución -->
                <div class="form-group">
                    <label for="fechaDevolucion">Fecha de devolución:</label>
                    <!-- *{fechaDevolucion} validará el campo con el DTO -->
                    <input type="date" id="fechaDevolucion" th:field="*{fechaDevolucion}">
                    <!-- Muestra el mensaje de error que pusimos en el DTO-->
                    <span class="error-msg" th:if="${#fields.hasErrors('fechaDevolucion')}" th:errors="*{fechaDevolucion}">Error en la fecha de devolución</span>
                </div>

                <!-- 6. Unidades solicitadas -->
                <div class="form-group">
                    <label for="unidades">Unidades (Máx. 3):</label>
                    <!-- Vinculado a la propiedad 'unidades' del DTO -->
                    <input type="number" id="unidades" th:field="*{unidades}" min="1" max="3" value="1">
                    <!-- Muestra el mensaje de error que pusimos en el DTO-->
                    <span class="error-msg" th:if="${#fields.hasErrors('unidades')}" th:errors="*{unidades}">Error en las unidades</span>
                </div>

                <!-- 7. Motivo del préstamo -->
                <div class="form-group">
                    <label for="motivo">Motivo del préstamo (entre 30 y 400 caracteres):</label>
                    <!-- Usamos textarea ya que el motivo requiere un texto más largo especificado en el DTO -->
                    <!-- *{motivo} validará las condiciones que tenemos dentro del DTO -->
                    <textarea id="motivo" th:field="*{motivo}" rows="4" placeholder="Explique brevemente el motivo..."></textarea>
                    <!-- Muestra el mensaje de error que pusimos en el DTO-->
                    <span class="error-msg" th:if="${#fields.hasErrors('motivo')}" th:errors="*{motivo}">Error en el motivo</span>
                </div>

                <!-- Aceptación de condiciones -->
                <div class="checkbox-group" style="margin-top: 15px; display: flex; align-items: center; gap: 8px;">
                    <!-- th:field="*{acepta}" verá si este campo está marcado, siendo true marcado y false no marcado -->
                    <input type="checkbox" id="acepta" th:field="*{acepta}">
                    <label for="acepta" style="margin-bottom: 0;">Debe aceptar las normas de la solicitud</label>
                </div>
                <!-- Muestra el mensaje de error que pusimos en el DTO-->
                <span class="error-msg" th:if="${#fields.hasErrors('acepta')}" th:errors="*{acepta}">Debe aceptar las normas</span>

                <!-- Botones de acción -->
                <div class="actions" style="margin-top: 25px; display: flex; gap: 10px; align-items: center;">
                    <button type="submit" class="btn">Enviar Solicitud</button>
                    <!-- th:href="@{/}" nos redirigirá a catalogo.html-->
                    <a th:href="@{/}" class="btn-secondary">Cancelar</a>
                </div>

            </form>
        </main>

    </body>
</html>
